version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portal_saberes
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Portal Saberes - CMS Wiki
  portal-saberes:
    build: ./api/portal-saberes
    ports:
      - "8080:10000"
    volumes:
      - ./api/portal-saberes:/app
      - ./core:/app/core
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=portal_saberes
      - DB_USER=root
      - DB_PASS=root
      - DB_CHARSET=utf8mb4
      - APP_URL=http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Caminho Saberes - Plataforma SPA
  caminho-saberes:
    build: ./api/caminho-saberes
    ports:
      - "8081:10000"
    volumes:
      - ./api/caminho-saberes:/app
      - ./core:/app/core
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=caminho_saberes
      - DB_USER=root
      - DB_PASS=root
      - DB_CHARSET=utf8mb4
      - APP_URL=http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Sites Estáticos
  static:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./sites:/usr/share/nginx/html:ro
      - ./docker/nginx/static.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  mysql-data:
