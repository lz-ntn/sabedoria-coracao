version: "3.8"

services:
  # Portal Saberes - PHP-FPM
  portal-saberes:
    build:
      context: ./api/portal-saberes
      dockerfile: Dockerfile.fpm
    volumes:
      - portal-core:/app/core
    env_file: .env.portal
    environment:
      - APP_ENV=production
    restart: unless-stopped

  # Caminho Saberes - PHP-FPM
  caminho-saberes:
    build:
      context: ./api/caminho-saberes
      dockerfile: Dockerfile.fpm
    volumes:
      - caminho-core:/app/core
    env_file: .env.caminho
    environment:
      - APP_ENV=production
    restart: unless-stopped

  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./sites:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
    depends_on:
      - portal-saberes
      - caminho-saberes
    restart: unless-stopped

volumes:
  portal-core:
  caminho-core:
