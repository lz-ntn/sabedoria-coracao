server {
    listen 80;
    server_name caminho.localhost caminho-saberes.onrender.com;

    root /var/www/caminho-saberes;
    index index.php;

    access_log /var/log/nginx/caminho.access.log;
    error_log /var/log/nginx/caminho.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass caminho-saberes:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location /api/ {
        try_files $uri /api/$uri.php?$query_string;
    }

    location ~ /\.(ht|env|git) {
        deny all;
    }
}
